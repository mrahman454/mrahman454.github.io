<!-- start custom footer snippets -->

<a href="/sitemap/">Sitemap</a>

<!-- MathJax: renders maths in abstracts and key points -->
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script"></script>

{% if page.plotly %}
<!-- Plotly (large): only on pages with `plotly: true` in their front matter -->
<script defer src='https://cdnjs.cloudflare.com/ajax/libs/plotly.js/3.0.1/plotly.min.js'></script>
{% endif %}

{% if page.mermaid %}
<!-- Mermaid diagrams: only on pages with `mermaid: true` in their front matter -->
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({startOnLoad:true, theme:'default'});
    await mermaid.run({querySelector:'code.language-mermaid'});
</script>
{% endif %}

{% if site.goatcounter.code and site.goatcounter.code != "" and site.goatcounter.show_visits %}
<span class="visit-count" id="visit-count" hidden></span>
<script>
(function () {
  var el = document.getElementById('visit-count');
  fetch('https://{{ site.goatcounter.code }}.goatcounter.com/counter/TOTAL.json')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d && d.count) { el.textContent = '\u00b7 ' + d.count + ' visits'; el.hidden = false; } })
    .catch(function () {});
})();
</script>
{% endif %}

<!-- end custom footer snippets -->
