{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist"><a href="{{ base_path }}/" title="{{ site.title }}"><span class="tl-dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="brand">mrahman@ntu<span class="brand__path">:~$</span></span><span class="brand-serious">Mostafizar Rahman</span></a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
    <button id="mode-toggle" class="mode-toggle" type="button" aria-pressed="false" title="Switch between the fun and the serious version of this site">
      <span class="mode-toggle__to-serious"><i class="fas fa-user-tie" aria-hidden="true"></i> serious</span>
      <span class="mode-toggle__to-fun"><i class="fas fa-terminal" aria-hidden="true"></i> fun</span>
    </button>
  </div>
</div>
