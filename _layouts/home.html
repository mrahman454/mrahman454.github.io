---
layout: default
---

{% include base_path %}

<div class="home">
  {{ content }}
</div>

<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Cipher state window: a grid of hex bytes updated round by round */
  var grid = document.getElementById('cipher-state');
  if (grid) {
    var COLS = 8, ROWS = 6, hex = '0123456789abcdef', cells = [];
    function rb() { return hex[Math.random() * 16 | 0] + hex[Math.random() * 16 | 0]; }
    for (var i = 0; i < COLS * ROWS; i++) {
      var s = document.createElement('span');
      s.textContent = rb();
      grid.appendChild(s);
      cells.push(s);
    }
    var roundEl = document.getElementById('cipher-round');
    var statusEl = document.getElementById('cipher-status');
    var round = 1, step = 0;

    function flash(el, cls) {
      el.textContent = rb();
      el.classList.remove('hot', 'col');
      void el.offsetWidth;
      el.classList.add(cls);
    }
    function tick() {
      // a few random byte substitutions every tick
      for (var n = 0; n < 3; n++) flash(cells[Math.random() * cells.length | 0], 'hot');
      // every 6 ticks, mix one full column
      if (step % 6 === 0) {
        var c = (step / 6) % COLS;
        for (var r = 0; r < ROWS; r++) flash(cells[r * COLS + c], 'col');
      }
      // every 24 ticks, next round
      if (step % 24 === 23) {
        round = round % 12 + 1;
        roundEl.textContent = (round < 10 ? '0' : '') + round;
        if (round === 12) { statusEl.textContent = 'ciphertext ready ✓'; statusEl.classList.add('ok'); }
        else if (round === 1) { statusEl.textContent = 'encrypting…'; statusEl.classList.remove('ok'); }
      }
      step++;
    }
    if (!reduce) setInterval(tick, 120);
  }

  /* Count-up numbers and fade-in on scroll */
  function countUp(el) {
    var end = +el.getAttribute('data-count'), t0 = null;
    if (reduce) { el.textContent = end; return; }
    function f(t) {
      if (!t0) t0 = t;
      var p = Math.min((t - t0) / 1000, 1);
      el.textContent = Math.round(end * p);
      if (p < 1) requestAnimationFrame(f);
    }
    requestAnimationFrame(f);
  }
  var items = document.querySelectorAll('.reveal, [data-count]');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        if (e.target.hasAttribute('data-count')) countUp(e.target);
        else e.target.classList.add('is-visible');
        io.unobserve(e.target);
      });
    }, { threshold: 0.1 });
    items.forEach(function (el) { io.observe(el); });
  } else {
    items.forEach(function (el) { el.classList.add('is-visible'); });
  }
})();
</script>
