---
layout: default
---

{% include base_path %}

<div class="home">
  {{ content }}
</div>

<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Hero background: a grid of hex bytes that flicker like a cipher state */
  var canvas = document.getElementById('hero-canvas');
  if (canvas && canvas.getContext) {
    var ctx = canvas.getContext('2d');
    var cell = 34, cols, rows, cells = [];
    var hex = '0123456789abcdef';
    function rb() { return hex[Math.random() * 16 | 0] + hex[Math.random() * 16 | 0]; }
    function resize() {
      var dpr = window.devicePixelRatio || 1;
      var w = canvas.offsetWidth, h = canvas.offsetHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cols = Math.ceil(w / cell) + 1; rows = Math.ceil(h / cell) + 1;
      cells = [];
      for (var i = 0; i < cols * rows; i++) cells.push({ v: rb(), glow: Math.random() * 0.3 });
    }
    function draw() {
      var w = canvas.offsetWidth, h = canvas.offsetHeight;
      ctx.clearRect(0, 0, w, h);
      ctx.font = '11px "SFMono-Regular", Menlo, Consolas, monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var k = cells[r * cols + c];
          var a = 0.07 + k.glow * 0.75;
          ctx.fillStyle = 'rgba(125, 211, 252,' + a.toFixed(3) + ')';
          ctx.fillText(k.v, c * cell + cell / 2, r * cell + cell / 2);
          if (k.glow > 0) k.glow *= 0.94;
        }
      }
    }
    function tick() {
      for (var n = 0; n < 6; n++) {
        var k = cells[Math.random() * cells.length | 0];
        if (k) { k.v = rb(); k.glow = 1; }
      }
      draw();
      if (!reduce) setTimeout(function () { requestAnimationFrame(tick); }, 60);
    }
    resize(); tick();
    window.addEventListener('resize', function () { resize(); draw(); });
  }

  /* Rotating tagline */
  var rot = document.getElementById('hero-rotator');
  if (rot) {
    var words = JSON.parse(rot.getAttribute('data-words'));
    var wi = 0, ci = 0, del = false;
    function type() {
      var word = words[wi];
      if (reduce) { rot.textContent = word; return; }
      rot.textContent = word.slice(0, ci);
      if (!del && ci < word.length) { ci++; setTimeout(type, 55); }
      else if (!del) { del = true; setTimeout(type, 1800); }
      else if (ci > 0) { ci--; setTimeout(type, 25); }
      else { del = false; wi = (wi + 1) % words.length; setTimeout(type, 300); }
    }
    type();
  }

  /* Count-up numbers and scroll reveal */
  function countUp(el) {
    var end = +el.getAttribute('data-count'), t0 = null;
    if (reduce) { el.textContent = end; return; }
    function step(t) {
      if (!t0) t0 = t;
      var p = Math.min((t - t0) / 1200, 1);
      el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  var items = document.querySelectorAll('.reveal, [data-count]');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        if (e.target.hasAttribute('data-count')) countUp(e.target);
        else e.target.classList.add('is-visible');
        io.unobserve(e.target);
      });
    }, { threshold: 0.15 });
    items.forEach(function (el) { io.observe(el); });
  } else {
    items.forEach(function (el) { el.classList.add('is-visible'); });
  }
})();
</script>
