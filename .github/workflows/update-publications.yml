name: Update publications

# Looks for new papers about every 15 days (03:00 UTC on the 1st and 16th of each
# month) and adds them to the website. It can also be run by hand from the
# "Actions" tab: Update publications -> Run workflow.
on:
  schedule:
    - cron: "0 3 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write   # commit new publication files
  pages: write      # ask GitHub Pages to rebuild the site

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for new papers
        run: python3 scripts/update_publications.py

      - name: Rebuild the co-author and institution networks
        run: python3 scripts/build_coauthor_network.py --fetch

      - name: Commit and push if anything changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- _publications _data/news.yml _data/coauthors.json _data/affiliations.json assets/canv)" ]; then
            echo "No new publications."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _publications _data/news.yml _data/coauthors.json _data/affiliations.json assets/canv
          git commit -m "Add new publications (automatic update)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the website
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
